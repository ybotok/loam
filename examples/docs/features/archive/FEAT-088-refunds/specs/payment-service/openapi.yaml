# API delta for FEAT-088 — payment-service gains the refund operation.
#
# A feature contract holds only what the feature adds, changes or removes. The merge walks only
# the paths and methods this document spells, so authorizePayment and capturePayment, which it
# leaves out, stay exactly as the living contract has them. refundPayment is new, so it carries
# no `x-loam-based-on` pin: a pin is the digest of the LIVING operation, and there is none. Only
# an operation the living contract already holds needs one (`loam rebase` writes it), and every
# such operation quoted without being changed is one more pin and a collision waiting for a
# parallel feature to edit or remove it.
openapi: 3.1.0
info:
  title: payment-service
  version: "1.0"
paths:
  /payments/{id}/refund:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: refundPayment
      summary: Refund a captured payment
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        "409":
          description: The payment was already refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Refund:
      type: object
      required: [paymentId, refundedAmount, refundedAt]
      properties:
        paymentId:
          type: string
          format: uuid
        refundedAmount:
          type: integer
          description: minor units
        refundedAt:
          type: string
          format: date-time
    # Quoted from the living contract unchanged, and it did not need to be: the `$ref` to it
    # above resolves into the living document, which already holds Problem. The merge leaves a
    # component the living document holds IDENTICALLY alone; one it holds DIFFERENTLY is
    # overwritten wholesale and reported as `openapi.component-modified`. Components carried no
    # baseline pin when this feature archived; a quote like this one now needs one in the root
    # `x-loam-baselines` record `loam rebase` writes — one more reason to leave it out.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
