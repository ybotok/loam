# API contract. Written by an agent from the `loam adopt` brief; forward-flow authors changes in the delta.
openapi: 3.1.0
info:
  title: payment-service
  version: "1.0"
paths:
  /payments:
    post:
      operationId: authorizePayment
      summary: Authorize a payment
      responses:
        "201":
          description: Authorized
          content:
            application/json:
              schema:
                type: object
                required: [paymentId, status]
                properties:
                  paymentId:
                    type: string
                  status:
                    type: string
                    enum: [authorized, declined]
  /payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Capture an authorized payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Captured
          content:
            application/json:
              schema:
                type: object
                required: [paymentId, capturedAmount]
                properties:
                  paymentId:
                    type: string
                  capturedAmount:
                    type: number
