# Service health model. Targets are authored; the dependency graph comes from
# C4 — this service's own model.likec4, which carries everything the service
# touches. planned: `loam health` composes these across the fleet -> cascade /
# blast-radius.
#
# `loam validate` reads only ids here: the `name` of each SLI and alert (every
# declared id wants a covering requirement in arch.spec.md, or
# `health.uncovered` says nothing tests it), and each dependency's `service:`
# id, which must resolve in model.likec4 (`health.dependency-unmodelled`
# otherwise). A dependency a feature in flight introduces arrives with that
# feature — it is not a dependency of the living service yet.
service: payment-service
status: draft
slis:
  - name: availability
    query: "sum(rate(http_requests_total{code!~'5..'}[5m])) / sum(rate(http_requests_total[5m]))"
    slo: 0.999
  - name: latency_p99_ms
    query: "histogram_quantile(0.99, http_request_duration_seconds_bucket)"
    slo: 300
alerts:
  - name: payment_authorization_5xx
    expr: "rate(http_requests_total{path='/payments',code=~'5..'}[5m]) > 0.01"
    page: payments-oncall
checks:
  liveness: GET /actuator/health/liveness
  readiness: GET /actuator/health/readiness
dependencies:
  - service: kafka
    criticality: critical        # kafka down -> payment-service unhealthy
