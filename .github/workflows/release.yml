name: release

on:
  push:
    tags:
      - "v*"

# Read-only is the workflow default. Only the publish job receives an OIDC
# token, after the complete release gate and the protected environment.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Pack the immutable publication candidate
        id: pack
        run: npm run release:pack -- --out "$RUNNER_TEMP/loam-release" --github-output "$GITHUB_OUTPUT"
      - name: Smoke the exact publication candidate
        run: npm run test:package -- --tarball "${{ steps.pack.outputs.tarball }}"
      - name: Verify tag, package contents, metadata, and release policy
        run: npm run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Upload the exact tarball and its SHA-256 manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/loam-release
          if-no-files-found: error
          # Long enough to outlive the human-approval gate below. At 1 day a tag
          # cut on a Friday expires before anyone approves it, and the publish
          # job then repacks a candidate nobody reviewed.
          retention-days: 14
          compression-level: 0

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # `registry-url` always makes setup-node write an auth-token line into the
      # npmrc it points npm at. There is no token here by design, so the line
      # expands to an empty value — and npm reads "a credential is configured",
      # never exchanges the OIDC token for a registry one, and publishes
      # unauthenticated. The registry answers that with 404 rather than 403, so
      # it reads as a missing package instead of a missing credential. Strip the
      # line and npm reaches for OIDC, which is the only credential this job has.
      - name: Leave npm no empty credential to mistake for a real one
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "stripped the auth-token line from $npmrc"
          else
            echo "no npmrc at $npmrc"
          fi
      - name: Download the gated publication candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/loam-release
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1
      - name: Confirm npm trusted-publishing minimum
        run: npm --version
      - name: Verify artifact hash, tag, commit, runtime, and OIDC context
        id: artifact
        run: node scripts/verify-release-artifact.mjs --dir "$RUNNER_TEMP/loam-release" --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing and automatic provenance
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --access public --tag "${{ steps.artifact.outputs.dist-tag }}"
