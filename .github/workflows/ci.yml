# Minimal honest gate: typecheck + full suite on every push and PR.
# No coverage, no matrix — the suite itself is the canary (it exercises the
# real LikeC4 parser on every fixture, which is also why the timeout is
# generous: Langium's first parse is slow and vitest allows 120s per test).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
