# Supported-runtime gate plus an install-from-tarball smoke. The seven vendored
# OpenSpec fixtures run in the normal suite; scheduled/manual jobs exercise the
# four complete corpora — the certified v1.14.1 release and the three older
# regression pins — from external, commit-pinned checkouts. The newest upstream
# release, which no pin names, is openspec-canary.yml's question, not this
# gate's.
name: ci

on:
  # Only main pushes: a bare `push:` ran the whole matrix twice for every commit
  # on a pull-request branch, and ran it again alongside release.yml on a tag.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# One live run per ref per trigger, so a superseded commit stops burning
# minutes and a scheduled corpus run is not cancelled by a push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The Node 24 leg runs the coverage suite, and its wall time on a hosted
    # runner swings with the runner, not the change: 22.5, 25.0, 31.7, 33.5 and
    # 42.6 minutes on the five green runs before 0.2.0-alpha.17, while the
    # 22.22.3 leg held at 23-25. alpha.17's cut (run 40902107156) was cancelled
    # mid-coverage at 45 with every test that had run green. release.yml's gate
    # runs the same step and takes the same budget.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.3", "24"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The unified architecture gate: file-level cycles, the package graph,
      # core/commands layering, the barrel ban, the console/process boundary,
      # child-process bounds, and brand-cast containment — each pinned by a
      # negative self-test in test/arch-gate.test.ts.
      - run: npm run arch:check
      # BESIDE arch:check rather than inside it, and the difference is the whole
      # point of the self-hosting axis: arch:check proves the layering HOLDS,
      # this proves the written model still DESCRIBES the tree. They can fail
      # independently — a package added and drawn nowhere breaks no rule, and a
      # cycle breaks every rule while the map stays perfectly current — so
      # folding one into the other would report two subjects under one verdict.
      # One matrix leg: it reads the same files on both, and the answer cannot
      # differ by Node version.
      #
      # No `--strict` on the loam side of this axis. The self-model legitimately
      # carries warnings (a spec whose `sources` cannot be spelled from a
      # subdirectory), and the exact finding set is pinned in
      # test/self-model.test.ts, which is the tighter grip: --strict would only
      # turn today's two warnings red, while the pin fails on a third.
      - run: npm run meta:check
        if: matrix.node-version == '22.22.3'
      # The other half of the same axis, and it needs its own step because the
      # failure it catches is invisible to every check that exists. `AGENTS.md`
      # in a docs repo is GENERATED and loam deliberately never rewrites it;
      # `agents.stale` detects on the version STAMP, so a same-version change to
      # the sections in src/core/agent/ leaves meta/docs/AGENTS.md behind while
      # every command still calls the repo healthy. In a fleet that is somebody
      # else's file and a version bump surfaces it. Here the sections and the
      # file are in one repository and one commit can move the first without the
      # second — which had already happened when this step was added.
      - run: npx tsx scripts/meta-agents.ts --check
        if: matrix.node-version == '22.22.3'
      - run: npm test
        if: matrix.node-version == '22.22.3'
      - run: npm run test:coverage
        if: matrix.node-version == '24'

  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22.22.3"
          - os: ubuntu-latest
            node-version: "24"
          - os: windows-latest
            node-version: "24"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:package
      - run: npm run release:check:selftest
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'

  # The concurrency-stability proof: three sequential full-suite runs per leg
  # at the configured parallelism, classified (product / runner-policy /
  # coverage-threshold / infrastructure) and never retried — see
  # scripts/gate-stress.mjs. Scheduled/manual only, like the corpus job, so
  # push/PR latency is unchanged. Reading of the roadmap's exit criterion,
  # stated so the maintainer can choose otherwise: "three consecutive clean CI
  # executions" is satisfied here as three sequential runs inside ONE job
  # execution per matrix leg; three separate workflow_dispatch runs of the
  # same commit are the stricter reading and remain available by dispatching
  # three times.
  stability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Three runs times gate-stress.mjs's own 45-minute ceiling per run, plus
    # setup. The job limit must never be what ends a run: a run the script
    # kills is classified and summarized, while a job GitHub cancels prints no
    # verdict at all. At 45 the Node 24 leg was cancelled on every scheduled run
    # from 2026-10-05 to 2026-10-26 — one coverage run took 12.9–21.1 minutes in
    # the test job those weeks, so three need up to 63 — and the Node 22 leg's
    # three plain runs had reached 39.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "22.22.3"
            args: "--runs 3"
          - node-version: "24"
            args: "--runs 3 --coverage"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node scripts/gate-stress.mjs ${{ matrix.args }}

  openspec-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: release
            commit: 87c3595ace6a2e22957f39ebe5b74c2f2316e0cb
          - baseline: previous
            commit: 2826b8889e5223a9a8095d4428b60b56597e1020
          - baseline: legacy
            commit: 4e16790d90d8f54d4773ad9a5e71a57cd9f1e86b
          - baseline: canary
            commit: 45cca5db6137ed209117cc70510eb3e057fb981b
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: loam
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Fission-AI/OpenSpec
          ref: ${{ matrix.commit }}
          path: openspec-upstream
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: loam/package-lock.json
      - run: npm ci
        working-directory: loam
      - name: Check the pinned OpenSpec ${{ matrix.baseline }} corpus
        run: npm run test:openspec-corpus -- --baseline "${{ matrix.baseline }}" "$GITHUB_WORKSPACE/openspec-upstream"
        working-directory: loam
